# Volunteer Planner, inside the container. There is no login, because the port is published only
# on 127.0.0.1. Any other hostname is refused, which stops DNS rebinding.
server {
    listen 8080 default_server;
    server_name _;
    default_type text/plain;
    return 403 "This app can only be opened on this device through localhost.\n";
}

server {
    listen 8080;
    server_name localhost 127.0.0.1 [::1];
    absolute_redirect off;
    port_in_redirect off;
    root /opt/ui;
    index index.html;

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # The API checks Host and Origin itself, so both pass through as sent.
    location /api/ {
        proxy_pass http://127.0.0.1:8770/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        client_max_body_size 2m;
    }
}
